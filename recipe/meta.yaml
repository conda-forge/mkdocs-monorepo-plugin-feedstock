{% set name = "mkdocs-monorepo-plugin" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mkdocs-monorepo-plugin-{{ version }}.tar.gz
  sha256: ccc566e166aac5ae7fade498c15c4a337a4892d238629b51aba8ef3fc7099034

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - mkdocs >=1.0.4
    - python-slugify >=4.0.1

test:
  imports:
    - mkdocs_monorepo_plugin
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/backstage/mkdocs-monorepo-plugin
  summary: Plugin for adding monorepository support in Mkdocs.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mahf708
